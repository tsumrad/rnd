name: Security Vulnerability Rollup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Daily at 09:00 UTC

jobs:
  rollup:
    name: Run Security Vulnerability Rollup
    uses: tsumrad/gh-tools/.github/workflows/security-vulnerability-rollup.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      vulnerability-alerts: read
    with:
      severities: 'critical,high'
